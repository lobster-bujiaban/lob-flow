[project]
name = "lob-flow"
version = "0.1.0"
description = "A learning implementation of an AI application platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "croniter>=6,<7",
    "cryptography>=45,<47",
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.35,<1",
]

[project.scripts]
lob-flow = "lob_flow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lob_flow"]
